<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WLED-Lang Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
  }
  #app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- Left: Editor panel ---- */
  #editor-panel {
    width: 50%;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #333;
    background: #16213e;
  }
  .editor-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    background: #1a1a2e;
    border-bottom: 1px solid #333;
    flex-wrap: wrap;
  }
  .editor-toolbar .btn { font-size: 12px; padding: 4px 10px; }
  .editor-toolbar select {
    background: #2a2a4a;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    max-width: 220px;
  }
  .editor-toolbar .spacer { flex: 1; }
  .editor-toolbar .filename {
    font-size: 12px;
    color: #7fdbca;
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 200px;
  }

  #editor {
    flex: 1;
    width: 100%;
    background: #0d1117;
    color: #c9d1d9;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.5;
    padding: 12px;
    tab-size: 2;
  }

  .compile-status {
    padding: 6px 10px;
    font-size: 12px;
    font-family: monospace;
    border-top: 1px solid #333;
    background: #1a1a2e;
    min-height: 28px;
    max-height: 80px;
    overflow-y: auto;
  }
  .compile-status.ok { color: #c3e88d; }
  .compile-status.err { color: #ff6b6b; }

  /* ---- Right: Simulator panel ---- */
  #sim-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px;
    min-width: 380px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #333;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .header h1 {
    font-size: 18px;
    color: #7fdbca;
    font-weight: 600;
  }
  .header-btns {
    display: flex;
    gap: 6px;
  }
  .effect-info {
    width: 100%;
    font-size: 12px;
    color: #999;
  }
  .effect-info span { color: #c3e88d; }

  .btn {
    padding: 5px 12px;
    border: 1px solid #555;
    background: #2a2a4a;
    color: #e0e0e0;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .btn:hover { background: #3a3a5a; }
  .btn.primary { background: #3d5a80; border-color: #5a8ab4; }
  .btn.primary:hover { background: #4d6a90; }
  .btn.success { background: #2d6a4f; border-color: #52b788; }
  .btn.success:hover { background: #3d7a5f; }
  .btn.danger { border-color: #ff6b6b; color: #ff6b6b; }
  .btn.danger:hover { background: #3a2a2a; }

  #canvas-wrap {
    background: #111;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 10px;
    border: 1px solid #333;
    position: relative;
    min-height: 160px;
  }
  #canvas-wrap canvas {
    display: block;
    width: 100%;
    border-radius: 4px;
  }
  #drop-overlay {
    position: absolute;
    inset: 0;
    background: rgba(61, 90, 128, 0.8);
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    pointer-events: none;
  }

  .playback {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
    border-bottom: 1px solid #333;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .stats {
    margin-left: auto;
    font-size: 11px;
    color: #888;
    font-family: monospace;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .control-group label {
    font-size: 11px;
    color: #999;
    display: flex;
    justify-content: space-between;
  }
  .control-group label span { color: #7fdbca; font-family: monospace; }
  .control-group input[type="range"] {
    width: 100%;
    accent-color: #7fdbca;
  }
  .control-group input[type="number"] {
    background: #2a2a4a;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 3px 6px;
    border-radius: 4px;
    width: 70px;
    font-size: 12px;
  }
  .control-group input[type="color"] {
    width: 44px;
    height: 26px;
    border: 1px solid #444;
    background: none;
    cursor: pointer;
    border-radius: 4px;
  }
  .control-group input[type="text"] {
    background: #2a2a4a;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
  .control-group select {
    background: #2a2a4a;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row label { font-size: 11px; color: #999; }

  .control-wide { grid-column: 1 / -1; }

  .mode-toggle {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .mode-toggle label {
    cursor: pointer;
    font-size: 12px;
  }
  .mode-toggle input { accent-color: #7fdbca; }

  .check-row {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .check-row label {
    font-size: 11px;
    color: #999;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .check-row input { accent-color: #7fdbca; }

  .colors-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .colors-row label { font-size: 11px; color: #999; }

  #file-input { display: none; }

  #resize-handle {
    width: 4px;
    cursor: col-resize;
    background: #333;
    transition: background 0.2s;
  }
  #resize-handle:hover { background: #7fdbca; }

  .shortcut {
    font-size: 10px;
    color: #666;
    padding: 4px 10px;
    border-top: 1px solid #333;
    background: #1a1a2e;
  }
  .shortcut kbd {
    background: #2a2a4a;
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid #444;
    font-family: monospace;
    font-size: 10px;
  }
</style>
</head>
<body>
<div id="app">
  <!-- Left: Editor Panel -->
  <div id="editor-panel">
    <div class="editor-toolbar">
      <select id="example-browser" title="Load example effect">
        <option value="">-- Examples --</option>
      </select>
      <button class="btn success" id="btn-compile" title="Compile & Run (Ctrl+Enter)">Compile & Run</button>
      <button class="btn" id="btn-download" title="Download compiled .wfx">Download .wfx</button>
      <button class="btn" id="btn-new">New</button>
      <span class="spacer"></span>
      <span class="filename" id="current-file">untitled.wled</span>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="compile-status" id="compile-status">Ready — write WLED-Lang code and press Compile & Run</div>
    <div class="shortcut"><kbd>Ctrl+Enter</kbd> Compile & Run | <kbd>Tab</kbd> Indent | Drag & drop .wled / .wfx files</div>
  </div>

  <!-- Resize handle -->
  <div id="resize-handle"></div>

  <!-- Right: Simulator Panel -->
  <div id="sim-panel">
    <div class="header">
      <h1>WLED-Lang Simulator</h1>
      <div class="header-btns">
        <button class="btn primary" id="btn-load">Load File</button>
      </div>
      <div class="effect-info" id="effect-info">No effect loaded — select an example or write your own</div>
    </div>

    <div id="canvas-wrap">
      <canvas id="led-canvas" width="880" height="200"></canvas>
      <div id="drop-overlay">Drop .wfx or .wled file here</div>
    </div>

    <div class="playback">
      <button class="btn primary" id="btn-play">Play</button>
      <button class="btn" id="btn-step">Step</button>
      <button class="btn danger" id="btn-reset">Reset</button>
      <div class="stats" id="stats">FPS: -- | Frame: 0</div>
    </div>

    <div class="controls">
      <div class="control-group control-wide">
        <div class="row">
          <div class="mode-toggle">
            <label><input type="radio" name="mode" value="1d" checked> 1D</label>
            <label><input type="radio" name="mode" value="2d"> 2D</label>
          </div>
          <label>Width: <input type="number" id="seg-width" value="30" min="1" max="256"></label>
          <label>Height: <input type="number" id="seg-height" value="1" min="1" max="256" disabled></label>
        </div>
      </div>

      <div class="control-group">
        <label>Speed <span id="val-speed">128</span></label>
        <input type="range" id="seg-speed" min="0" max="255" value="128">
      </div>
      <div class="control-group">
        <label>Intensity <span id="val-intensity">128</span></label>
        <input type="range" id="seg-intensity" min="0" max="255" value="128">
      </div>
      <div class="control-group">
        <label>Custom 1 <span id="val-c1">0</span></label>
        <input type="range" id="seg-c1" min="0" max="255" value="0">
      </div>
      <div class="control-group">
        <label>Custom 2 <span id="val-c2">0</span></label>
        <input type="range" id="seg-c2" min="0" max="255" value="0">
      </div>
      <div class="control-group">
        <label>Custom 3 <span id="val-c3">0</span></label>
        <input type="range" id="seg-c3" min="0" max="255" value="0">
      </div>
      <div class="control-group">
        <label>Palette</label>
        <select id="seg-palette"></select>
      </div>

      <div class="control-group control-wide">
        <div class="check-row">
          <label><input type="checkbox" id="seg-check1"> Check 1</label>
          <label><input type="checkbox" id="seg-check2"> Check 2</label>
          <label><input type="checkbox" id="seg-check3"> Check 3</label>
        </div>
      </div>

      <div class="control-group control-wide">
        <div class="colors-row">
          <label>Color 1: <input type="color" id="seg-color1" value="#ffffff"></label>
          <label>Color 2: <input type="color" id="seg-color2" value="#000000"></label>
          <label>Color 3: <input type="color" id="seg-color3" value="#000000"></label>
        </div>
      </div>

      <div class="control-group control-wide">
        <label>Segment Name</label>
        <input type="text" id="seg-name" placeholder="Enter segment name (for text effects)">
      </div>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".wfx,.wled">

// ---- Integer helpers ----
function i32(v) { return v | 0; }
function u32(v) { return v >>> 0; }
function u8(v) { return v & 0xFF; }
function u16(v) { return v & 0xFFFF; }

// ---- FastLED-compatible math ----
const SIN8_TABLE = new Uint8Array(256);
for (let i = 0; i < 256; i++) {
  SIN8_TABLE[i] = Math.round(128 + 127 * Math.sin(i * 2 * Math.PI / 256));
}
function sin8(x) { return SIN8_TABLE[u8(x)]; }
function cos8(x) { return SIN8_TABLE[u8(x + 64)]; }

function sin16(x) {
  return i32(Math.round(32767 * Math.sin(u16(x) * 2 * Math.PI / 65536)));
}

function triwave8(x) {
  const v = u8(x);
  return v < 128 ? v * 2 : (255 - v) * 2;
}

function quadwave8(x) { return sin8(triwave8(x)); }

function scale8(a, b) { return u8(Math.floor((u8(a) * u8(b)) / 256)); }

function qadd8(a, b) {
  const s = u8(a) + u8(b);
  return s > 255 ? 255 : s;
}

function qsub8(a, b) {
  const s = u8(a) - u8(b);
  return s < 0 ? 0 : s;
}

function sqrt16(v) {
  if (v <= 0) return 0;
  return Math.floor(Math.sqrt(u16(v)));
}

// PRNG (xorshift32)
let _rngState = 12345;
function _nextRng() {
  let x = _rngState;
  x ^= x << 13;
  x ^= x >> 17;
  x ^= x << 5;
  _rngState = x;
  return u32(x);
}
function random8() { return _nextRng() & 0xFF; }
function random16() { return _nextRng() & 0xFFFF; }
function randomRange(lo, hi) {
  lo = u8(lo); hi = u8(hi);
  if (lo >= hi) return lo;
  return lo + (_nextRng() % (hi - lo));
}

// Noise (simple hash-based)
function inoise8_1(x) { return u8((x * 37 + 97) ^ (x >> 3)); }
function inoise8_2(x, y) { return u8(inoise8_1(x) ^ inoise8_1(y + 53)); }
function inoise8_3(x, y, z) { return u8(inoise8_2(x, y) ^ inoise8_1(z + 127)); }

// ---- Color helpers ----
function RGBW32(r, g, b, w) {
  return u32((u8(w) << 24) | (u8(r) << 16) | (u8(g) << 8) | u8(b));
}
function R(c) { return (u32(c) >> 16) & 0xFF; }
function G(c) { return (u32(c) >> 8) & 0xFF; }
function B(c) { return u32(c) & 0xFF; }
function W(c) { return (u32(c) >> 24) & 0xFF; }

function color_fade(c, amount) {
  const a = u8(amount);
  return RGBW32(
    Math.floor(R(c) * a / 256),
    Math.floor(G(c) * a / 256),
    Math.floor(B(c) * a / 256),
    Math.floor(W(c) * a / 256)
  );
}

function color_add(a, b) {
  return RGBW32(
    Math.min(255, R(a) + R(b)),
    Math.min(255, G(a) + G(b)),
    Math.min(255, B(a) + B(b)),
    Math.min(255, W(a) + W(b))
  );
}

function color_wheel(pos) {
  pos = u8(pos);
  if (pos < 85) return RGBW32(255 - pos * 3, pos * 3, 0, 0);
  if (pos < 170) { pos -= 85; return RGBW32(0, 255 - pos * 3, pos * 3, 0); }
  pos -= 170; return RGBW32(pos * 3, 0, 255 - pos * 3, 0);
}

// fade_out: per-pixel fade toward background color (ported from FX_fcn.cpp)
// rate: 0 = no fade (max retention), 255 = instant fade (min retention)
function fade_out_1d(pixels, rate, bgColor) {
  if (rate === 0) return;
  // Match WLED C++ mapping: rate = (256-rate)>>1; mappedRate = rate + 1.1
  const r2 = (256 - rate) >> 1;
  const mappedRate = r2 + 1.1;
  const bgR = R(bgColor), bgG = G(bgColor), bgB = B(bgColor), bgW = W(bgColor);

  for (let i = 0; i < pixels.length; i++) {
    const c = pixels[i];
    if (c === bgColor) continue;

    let cr = R(c), cg = G(c), cb = B(c), cw = W(c);
    if (cr === bgR && cg === bgG && cb === bgB && cw === bgW) continue;

    cr = (cr > bgR) ? Math.max(bgR, cr - Math.ceil((cr - bgR) / mappedRate)) : Math.min(bgR, cr + Math.ceil((bgR - cr) / mappedRate));
    cg = (cg > bgG) ? Math.max(bgG, cg - Math.ceil((cg - bgG) / mappedRate)) : Math.min(bgG, cg + Math.ceil((bgG - cg) / mappedRate));
    cb = (cb > bgB) ? Math.max(bgB, cb - Math.ceil((cb - bgB) / mappedRate)) : Math.min(bgB, cb + Math.ceil((bgB - cb) / mappedRate));
    cw = (cw > bgW) ? Math.max(bgW, cw - Math.ceil((cw - bgW) / mappedRate)) : Math.min(bgW, cw + Math.ceil((bgW - cw) / mappedRate));

    pixels[i] = RGBW32(cr, cg, cb, cw);
  }
}

function fade_out_2d(pixels2d, w, h, rate, bgColor) {
  for (let y = 0; y < h; y++) {
    fade_out_1d(pixels2d[y], rate, bgColor);
  }
}

// blur1d: FastLED blur with carryover
function blur1d(pixels, amount) {
  if (amount === 0 || pixels.length < 2) return;
  const keep = 255 - amount;
  const seep = amount >> 1;
  let carryR = 0, carryG = 0, carryB = 0, carryW = 0;

  for (let i = 0; i < pixels.length; i++) {
    const c = pixels[i];
    const cr = R(c), cg = G(c), cb = B(c), cw = W(c);

    const newR = Math.floor(cr * keep / 256) + carryR;
    const newG = Math.floor(cg * keep / 256) + carryG;
    const newB = Math.floor(cb * keep / 256) + carryB;
    const newW = Math.floor(cw * keep / 256) + carryW;

    carryR = Math.floor(cr * seep / 256);
    carryG = Math.floor(cg * seep / 256);
    carryB = Math.floor(cb * seep / 256);
    carryW = Math.floor(cw * seep / 256);

    pixels[i] = RGBW32(
      Math.min(255, newR), Math.min(255, newG),
      Math.min(255, newB), Math.min(255, newW)
    );
  }
}

// blur2d: blur rows then columns
function blur2d(pixels2d, w, h, amountX, amountY) {
  // Blur all rows (X direction)
  for (let y = 0; y < h; y++) {
    blur1d(pixels2d[y], amountX);
  }
  // Blur all columns (Y direction)
  if (amountY === 0) return;
  const keep = 255 - amountY;
  const seep = amountY >> 1;
  for (let x = 0; x < w; x++) {
    let carryR = 0, carryG = 0, carryB = 0, carryW = 0;
    for (let y = 0; y < h; y++) {
      const c = pixels2d[y][x];
      const cr = R(c), cg = G(c), cb = B(c), cw = W(c);
      const newR = Math.floor(cr * keep / 256) + carryR;
      const newG = Math.floor(cg * keep / 256) + carryG;
      const newB = Math.floor(cb * keep / 256) + carryB;
      const newW = Math.floor(cw * keep / 256) + carryW;
      carryR = Math.floor(cr * seep / 256);
      carryG = Math.floor(cg * seep / 256);
      carryB = Math.floor(cb * seep / 256);
      carryW = Math.floor(cw * seep / 256);
      pixels2d[y][x] = RGBW32(
        Math.min(255, newR), Math.min(255, newG),
        Math.min(255, newB), Math.min(255, newW)
      );
    }
  }
}

// drawLine: Bresenham's algorithm (from FX_2Dfcn.cpp)
function drawLine(pixels2d, w, h, x0, y0, x1, y1, color) {
  const dx = Math.abs(x1 - x0);
  const dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1;
  const sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;

  for (;;) {
    if (x0 >= 0 && x0 < w && y0 >= 0 && y0 < h) {
      pixels2d[y0][x0] = color;
    }
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// drawCircle: Bresenham midpoint circle
function drawCircle(pixels2d, w, h, cx, cy, radius, color) {
  let x = -radius, y = 0, err = 2 - 2 * radius;
  while (x < 0) {
    _setPixel2d(pixels2d, w, h, cx - x, cy + y, color);
    _setPixel2d(pixels2d, w, h, cx - y, cy - x, color);
    _setPixel2d(pixels2d, w, h, cx + x, cy - y, color);
    _setPixel2d(pixels2d, w, h, cx + y, cy + x, color);
    const r = err;
    if (r <= y) err += ++y * 2 + 1;
    if (r > x || err > y) err += ++x * 2 + 1;
  }
}

// fillCircle: x^2 + y^2 <= r^2 test
function fillCircle(pixels2d, w, h, cx, cy, radius, color) {
  radius = Math.min(Math.abs(radius), Math.max(w, h)); // clamp to grid size
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (dx * dx + dy * dy <= radius * radius) {
        _setPixel2d(pixels2d, w, h, cx + dx, cy + dy, color);
      }
    }
  }
}

function _setPixel2d(pixels2d, w, h, x, y, color) {
  if (x >= 0 && x < w && y >= 0 && y < h) {
    pixels2d[y][x] = color;
  }
}

// move: 8-direction pixel shift (FX_2Dfcn.cpp:365-434)
function movePixels(pixels2d, w, h, dir, delta, wrap) {
  if (delta === 0) return;
  switch (dir) {
    case 0: _moveX(pixels2d, w, h, delta, wrap); break;       // right
    case 1: _moveX(pixels2d, w, h, -delta, wrap); break;      // left
    case 2: _moveY(pixels2d, w, h, -delta, wrap); break;      // up
    case 3: _moveY(pixels2d, w, h, delta, wrap); break;       // down
    case 4: _moveX(pixels2d, w, h, delta, wrap); _moveY(pixels2d, w, h, -delta, wrap); break;  // right-up
    case 5: _moveX(pixels2d, w, h, -delta, wrap); _moveY(pixels2d, w, h, -delta, wrap); break; // left-up
    case 6: _moveX(pixels2d, w, h, delta, wrap); _moveY(pixels2d, w, h, delta, wrap); break;   // right-down
    case 7: _moveX(pixels2d, w, h, -delta, wrap); _moveY(pixels2d, w, h, delta, wrap); break;  // left-down
  }
}

function _moveX(pixels2d, w, h, delta, wrap) {
  for (let y = 0; y < h; y++) {
    const row = pixels2d[y];
    if (delta > 0) {
      for (let x = w - 1; x >= delta; x--) row[x] = row[x - delta];
      for (let x = 0; x < delta; x++) row[x] = wrap ? row[w - delta + x] : 0;
    } else {
      const d = -delta;
      for (let x = 0; x < w - d; x++) row[x] = row[x + d];
      for (let x = w - d; x < w; x++) row[x] = wrap ? row[x - w + d] : 0;
    }
  }
}

function _moveY(pixels2d, w, h, delta, wrap) {
  if (delta > 0) {
    for (let y = h - 1; y >= delta; y--) {
      for (let x = 0; x < w; x++) pixels2d[y][x] = pixels2d[y - delta][x];
    }
    for (let y = 0; y < delta; y++) {
      for (let x = 0; x < w; x++) pixels2d[y][x] = wrap ? pixels2d[h - delta + y][x] : 0;
    }
  } else {
    const d = -delta;
    for (let y = 0; y < h - d; y++) {
      for (let x = 0; x < w; x++) pixels2d[y][x] = pixels2d[y + d][x];
    }
    for (let y = h - d; y < h; y++) {
      for (let x = 0; x < w; x++) pixels2d[y][x] = wrap ? pixels2d[y - h + d][x] : 0;
    }
  }
}

// drawCharacter: font rendering (from FX_2Dfcn.cpp drawCharacter)
function drawCharacter(pixels2d, matW, matH, chr, x, y, fontIdx, color) {
  const font = FONTS[fontIdx];
  if (!font) return;
  const fw = font.w, fh = font.h;
  const charCode = chr - 32;
  if (charCode < 0 || charCode >= 95) return;
  const baseOffset = charCode * fh;

  for (let row = 0; row < fh; row++) {
    const bits = font.data[baseOffset + row];
    for (let col = 0; col < fw; col++) {
      // Bits are MSB-first, shifted to align with font width
      if ((bits >> (7 - col)) & 1) {
        _setPixel2d(pixels2d, matW, matH, x + col, y + row, color);
      }
    }
  }
}

// ---- Extract bytecode from .wfx ArrayBuffer ----
function extractBytecode(arrayBuffer) {
  const buf = new Uint8Array(arrayBuffer);
  if (buf.length < WFX.HEADER_SIZE) throw new Error('WFX too short');
  if (buf[0] !== 0x57 || buf[1] !== 0x46 || buf[2] !== 0x58) throw new Error('Bad WFX magic');

  const flags = buf[4];
  const dataSize = buf[5] * 16;
  const bcLen = buf[6] | (buf[7] << 8);

  let metaEnd = WFX.HEADER_SIZE;
  while (metaEnd < buf.length && buf[metaEnd] !== 0) metaEnd++;
  const metadata = new TextDecoder().decode(buf.slice(WFX.HEADER_SIZE, metaEnd));
  metaEnd++;

  const bytecode = buf.slice(metaEnd, metaEnd + bcLen);
  return { bytecode, metadata, flags, dataSize, bcLen };
}

// ---- SimState: persistent state across frames ----
function createState(opts = {}) {
  const len = opts.LEN || 30;
  const width = opts.WIDTH || len;
  const height = opts.HEIGHT || 1;
  const is2D = opts.is2D || false;

  const pixels1d = new Uint32Array(len);
  const pixels2d = [];
  for (let y = 0; y < height; y++) pixels2d.push(new Uint32Array(width));

  return {
    pixels1d,
    pixels2d,
    aux0: 0,
    aux1: 0,
    step: 0,
    call: 0,
    dataBuf: null,
    dataLen: 0,
    LEN: len,
    WIDTH: width,
    HEIGHT: height,
    is2D,
  };
}

// ---- SimEngine ----
class SimEngine {
  constructor() {
    this.regs = new Int32Array(REG_COUNT);
  }

  /**
   * Execute one frame of bytecode.
   * @param {Uint8Array} bytecode
   * @param {object} state - persistent SimState (mutated in-place)
   * @param {object} opts - segment parameters
   * @returns {{ delay: number }}
   */
  executeFrame(bytecode, state, opts = {}) {
    const bc = bytecode;
    const len = bc.length;

    this.regs = new Int32Array(REG_COUNT);
    const regs = this.regs;
    let pc = 0;
    let cycles = 0;
    const callStack = new Uint16Array(CALL_STACK_DEPTH);
    let callDepth = 0;

    const seg = {
      speed:     opts.speed     ?? 128,
      intensity: opts.intensity ?? 128,
      custom1:   opts.custom1   ?? 0,
      custom2:   opts.custom2   ?? 0,
      custom3:   opts.custom3   ?? 0,
      check1:    opts.check1    ?? false,
      check2:    opts.check2    ?? false,
      check3:    opts.check3    ?? false,
      palette:   opts.palette   ?? 0,
      colors:    opts.colors    ?? [0x00FFFFFF, 0x00000000, 0x00000000],
      name:      opts.name      ?? '',
    };

    // Use persistent state
    const pixels = state.pixels1d;
    const w = state.WIDTH, h = state.HEIGHT;
    const pixels2d = state.pixels2d;
    let dataBuf = state.dataBuf;
    let dataLen = state.dataLen;

    // Get the palette object
    const palObj = PALETTES[seg.palette] || PALETTES[0];

    // Populate registers from persistent state and opts
    regs[REG.P0] = seg.speed;
    regs[REG.P1] = seg.intensity;
    regs[REG.P2] = seg.custom1;
    regs[REG.P3] = seg.custom2;
    regs[REG.LEN]    = state.LEN;
    regs[REG.NOW]    = i32(opts.NOW ?? 0);
    regs[REG.CALL]   = i32(state.call);
    regs[REG.WIDTH]  = w;
    regs[REG.HEIGHT] = h;

    // Seed RNG with NOW for variation each frame
    _rngState = (opts.NOW || 1) ^ 0x5DEECE66;

    // Float helpers
    const floatBuf = new ArrayBuffer(4);
    const floatView = new DataView(floatBuf);
    function getFloat(id) {
      floatView.setInt32(0, getReg(id), true);
      return floatView.getFloat32(0, true);
    }
    function setFloat(id, f) {
      floatView.setFloat32(0, f, true);
      setReg(id, floatView.getInt32(0, true));
    }

    // ---- Read helpers ----
    function readU8() { return (pc < len) ? bc[pc++] : 0; }
    function readI16() {
      if (pc + 2 > len) { pc = len; return 0; }
      const v = (bc[pc] | (bc[pc + 1] << 8)) << 16 >> 16;
      pc += 2; return v;
    }
    function readU16() {
      if (pc + 2 > len) { pc = len; return 0; }
      const v = bc[pc] | (bc[pc + 1] << 8);
      pc += 2; return v;
    }
    function readI32() {
      if (pc + 4 > len) { pc = len; return 0; }
      const v = bc[pc] | (bc[pc + 1] << 8) | (bc[pc + 2] << 16) | (bc[pc + 3] << 24);
      pc += 4; return v;
    }

    function getReg(id) { return (id < REG_COUNT) ? regs[id] : 0; }
    function setReg(id, v) {
      if (id < REG_COUNT && id < REG_P0) regs[id] = i32(v);
    }
    function getColor(id) { return u32(getReg(id)); }
    function setColor(id, c) { setReg(id, i32(u32(c))); }

    // beatsin8: time-dependent
    function _beatsin8(bpm, lo, hi) {
      const now = u32(opts.NOW ?? 0);
      const beat = (now * u8(bpm) * 256) / 60000;
      const v = sin8(Math.floor(beat) & 0xFF);
      return u8(lo + scale8(v, hi - lo));
    }

    // Palette color lookup
    function palette_color(idx) {
      return colorFromPalette(palObj, u8(idx), 255);
    }

    function palette_color_ex(idx, bri, blend) {
      return colorFromPalette(palObj, u8(idx), u8(bri));
    }

    // ---- Main loop ----
    while (pc < len) {
      if (++cycles > MAX_CYCLES) return finish(FRAMETIME);

      const op = bc[pc++];

      switch (op) {
        // ---- Arithmetic ----
        case OP.ADD: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, i32(u32(getReg(a)) + u32(getReg(b)))); } break;
        case OP.SUB: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, i32(u32(getReg(a)) - u32(getReg(b)))); } break;
        case OP.MUL: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, i32(Math.imul(getReg(a), getReg(b)))); } break;
        case OP.DIV: {
          const d = readU8(), a = readU8(), b = readU8();
          const av = getReg(a), bv = getReg(b);
          setReg(d, (bv !== 0 && !(av === INT32_MIN && bv === -1)) ? i32(Math.trunc(av / bv)) : 0);
        } break;
        case OP.MOD: {
          const d = readU8(), a = readU8(), b = readU8();
          const av = getReg(a), bv = getReg(b);
          setReg(d, (bv !== 0 && !(av === INT32_MIN && bv === -1)) ? i32(av % bv) : 0);
        } break;
        case OP.AND: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, getReg(a) & getReg(b)); } break;
        case OP.OR:  { const d = readU8(), a = readU8(), b = readU8(); setReg(d, getReg(a) | getReg(b)); } break;
        case OP.XOR: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, getReg(a) ^ getReg(b)); } break;
        case OP.SHL: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, i32(u32(getReg(a)) << (getReg(b) & 31))); } break;
        case OP.SHR: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, i32(u32(getReg(a)) >>> (getReg(b) & 31))); } break;
        case OP.NEG: { const d = readU8(), a = readU8(); const v = getReg(a); setReg(d, (v === INT32_MIN) ? INT32_MAX : -v); } break;
        case OP.NOT: { const d = readU8(), a = readU8(); setReg(d, ~getReg(a)); } break;

        // ---- Load/Store ----
        case OP.LDI:   { const d = readU8(); setReg(d, readI16()); } break;
        case OP.LDI32: { const d = readU8(); setReg(d, readI32()); } break;
        case OP.MOV:   { const d = readU8(), a = readU8(); setReg(d, getReg(a)); } break;
        case OP.LDB: {
          const d = readU8(), a = readU8(), off = readU8();
          const addr = u16(getReg(a)) + off;
          setReg(d, (dataBuf && addr < dataLen) ? dataBuf[addr] : 0);
        } break;
        case OP.STB: {
          const a = readU8(), d = readU8(), off = readU8();
          const addr = u16(getReg(a)) + off;
          if (dataBuf && addr < dataLen) dataBuf[addr] = u8(getReg(d));
        } break;
        case OP.LDW: {
          const d = readU8(), a = readU8(), off = readU8();
          const addr = u16(getReg(a)) + off;
          if (dataBuf && addr + 3 < dataLen) {
            setReg(d, dataBuf[addr] | (dataBuf[addr+1]<<8) | (dataBuf[addr+2]<<16) | (dataBuf[addr+3]<<24));
          } else { setReg(d, 0); }
        } break;
        case OP.STW: {
          const a = readU8(), d = readU8(), off = readU8();
          const addr = u16(getReg(a)) + off;
          if (dataBuf && addr + 3 < dataLen) {
            const v = getReg(d);
            dataBuf[addr] = v & 0xFF; dataBuf[addr+1] = (v >> 8) & 0xFF;
            dataBuf[addr+2] = (v >> 16) & 0xFF; dataBuf[addr+3] = (v >> 24) & 0xFF;
          }
        } break;

        // ---- Segment Parameters ----
        case OP.GSPD: { setReg(readU8(), seg.speed); } break;
        case OP.GINT: { setReg(readU8(), seg.intensity); } break;
        case OP.GC1:  { setReg(readU8(), seg.custom1); } break;
        case OP.GC2:  { setReg(readU8(), seg.custom2); } break;
        case OP.GC3:  { setReg(readU8(), seg.custom3); } break;
        case OP.GCHK: {
          const d = readU8(), n = readU8();
          const v = (n === 0) ? seg.check1 : (n === 1) ? seg.check2 : seg.check3;
          setReg(d, v ? 1 : 0);
        } break;
        case OP.GCOL: {
          const d = readU8(), n = readU8();
          setColor(d, seg.colors[n < 3 ? n : 0] || 0);
        } break;
        case OP.GPAL: { setReg(readU8(), seg.palette); } break;
        case OP.GAUX: {
          const d = readU8(), n = readU8();
          setReg(d, (n === 0) ? state.aux0 : state.aux1);
        } break;
        case OP.SAUX: {
          const n = readU8(), a = readU8();
          if (n === 0) state.aux0 = u16(getReg(a));
          else         state.aux1 = u16(getReg(a));
        } break;
        case OP.GSTP: { setReg(readU8(), i32(state.step)); } break;
        case OP.SSTP: { state.step = u32(getReg(readU8())); } break;

        // ---- Pixel Operations ----
        case OP.SPXC: {
          const a = readU8(), c = readU8();
          const idx = getReg(a);
          if (idx >= 0 && idx < state.LEN) {
            const col = getColor(c);
            pixels[idx] = col;
            // Mirror 1D write to 2D grid (like WLED's setPixelColor on 2D segments)
            if (state.is2D) {
              const px = idx % w, py = Math.floor(idx / w);
              if (py < h) pixels2d[py][px] = col;
            }
          }
        } break;
        case OP.GPXC: {
          const d = readU8(), a = readU8();
          const idx = getReg(a);
          if (idx >= 0 && idx < state.LEN) {
            // In 2D mode, read from the 2D grid (consistent with SPXC mirroring)
            if (state.is2D) {
              const px = idx % w, py = Math.floor(idx / w);
              setColor(d, (py < h) ? pixels2d[py][px] : 0);
            } else {
              setColor(d, pixels[idx]);
            }
          } else {
            setColor(d, 0);
          }
        } break;
        case OP.SPXY: {
          const a = readU8(), b = readU8(), c = readU8();
          const x = getReg(a), y = getReg(b);
          if (x >= 0 && x < w && y >= 0 && y < h) pixels2d[y][x] = getColor(c);
        } break;
        case OP.GPXY: {
          const d = readU8(), a = readU8(), b = readU8();
          const x = getReg(a), y = getReg(b);
          setColor(d, (x >= 0 && x < w && y >= 0 && y < h) ? pixels2d[y][x] : 0);
        } break;
        case OP.FILL: {
          const c = readU8();
          const color = getColor(c);
          pixels.fill(color);
          for (let y2 = 0; y2 < h; y2++) pixels2d[y2].fill(color);
        } break;
        case OP.FADE: {
          const a = readU8();
          const rate = u8(getReg(a));
          const bgColor = seg.colors[1] || 0;
          if (state.is2D) {
            fade_out_2d(pixels2d, w, h, rate, bgColor);
            // Sync pixels1d from pixels2d so 1D reads stay consistent
            for (let y2 = 0; y2 < h; y2++)
              for (let x2 = 0; x2 < w; x2++)
                pixels[y2 * w + x2] = pixels2d[y2][x2];
          } else {
            fade_out_1d(pixels, rate, bgColor);
          }
        } break;
        case OP.BLUR: {
          const a = readU8();
          const bv = u8(getReg(a));
          if (state.is2D) {
            // In 2D mode, blur the 2D grid (1D effects using blur on 2D)
            blur2d(pixels2d, w, h, bv, bv);
            for (let y2 = 0; y2 < h; y2++)
              for (let x2 = 0; x2 < w; x2++)
                pixels[y2 * w + x2] = pixels2d[y2][x2];
          } else {
            blur1d(pixels, bv);
          }
        } break;
        case OP.BLR2: {
          const a = readU8();
          const bv = u8(getReg(a));
          blur2d(pixels2d, w, h, bv, bv);
        } break;

        // ---- Color Operations ----
        case OP.RGB: {
          const d = readU8(), ra = readU8(), rb = readU8(), rc = readU8();
          setColor(d, RGBW32(u8(getReg(ra)), u8(getReg(rb)), u8(getReg(rc)), 0));
        } break;
        case OP.RGBW: {
          const d = readU8(), ra = readU8(), rb = readU8(), rc = readU8(), rd2 = readU8();
          setColor(d, RGBW32(u8(getReg(ra)), u8(getReg(rb)), u8(getReg(rc)), u8(getReg(rd2))));
        } break;
        case OP.CBLND: {
          const d = readU8(), ca = readU8(), cb = readU8(), ra = readU8();
          setColor(d, color_blend(getColor(ca), getColor(cb), u16(getReg(ra))));
        } break;
        case OP.CFADE: {
          const d = readU8(), ca = readU8(), ra = readU8();
          setColor(d, color_fade(getColor(ca), u8(getReg(ra))));
        } break;
        case OP.CADD: {
          const d = readU8(), ca = readU8(), cb = readU8();
          setColor(d, color_add(getColor(ca), getColor(cb)));
        } break;
        case OP.CPAL: {
          const d = readU8(), ra = readU8();
          setColor(d, palette_color(u16(getReg(ra))));
        } break;
        case OP.CPALX: {
          const d = readU8(), ra = readU8(), rb = readU8(), rc = readU8();
          setColor(d, palette_color_ex(u16(getReg(ra)), u8(getReg(rb)), u8(getReg(rc))));
        } break;
        case OP.CWHL: {
          const d = readU8(), ra = readU8();
          setColor(d, color_wheel(u8(getReg(ra))));
        } break;
        case OP.EXTR: { const d = readU8(), ca = readU8(); setReg(d, R(getColor(ca))); } break;
        case OP.EXTG: { const d = readU8(), ca = readU8(); setReg(d, G(getColor(ca))); } break;
        case OP.EXTB: { const d = readU8(), ca = readU8(); setReg(d, B(getColor(ca))); } break;
        case OP.EXTW: { const d = readU8(), ca = readU8(); setReg(d, W(getColor(ca))); } break;

        // ---- Math ----
        case OP.SIN8:  { const d = readU8(), a = readU8(); setReg(d, sin8(u8(getReg(a)))); } break;
        case OP.COS8:  { const d = readU8(), a = readU8(); setReg(d, cos8(u8(getReg(a)))); } break;
        case OP.SIN16: { const d = readU8(), a = readU8(); setReg(d, sin16(u16(getReg(a)))); } break;
        case OP.BEAT8: {
          const d = readU8(), a = readU8(), b = readU8(), c = readU8();
          setReg(d, _beatsin8(u8(getReg(a)), u8(getReg(b)), u8(getReg(c))));
        } break;
        case OP.TRI8:  { const d = readU8(), a = readU8(); setReg(d, triwave8(u8(getReg(a)))); } break;
        case OP.QAD8:  { const d = readU8(), a = readU8(); setReg(d, quadwave8(u8(getReg(a)))); } break;
        case OP.SCL8:  { const d = readU8(), a = readU8(), b = readU8(); setReg(d, scale8(u8(getReg(a)), u8(getReg(b)))); } break;
        case OP.QADD8: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, qadd8(u8(getReg(a)), u8(getReg(b)))); } break;
        case OP.QSUB8: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, qsub8(u8(getReg(a)), u8(getReg(b)))); } break;
        case OP.RND8:  { setReg(readU8(), random8()); } break;
        case OP.RND16: { setReg(readU8(), random16()); } break;
        case OP.RNDR:  { const d = readU8(), a = readU8(), b = readU8(); setReg(d, randomRange(u8(getReg(a)), u8(getReg(b)))); } break;
        case OP.NOISE: { const d = readU8(), a = readU8(); setReg(d, inoise8_1(u16(getReg(a)))); } break;
        case OP.NOI2:  { const d = readU8(), a = readU8(), b = readU8(); setReg(d, inoise8_2(u16(getReg(a)), u16(getReg(b)))); } break;
        case OP.NOI3:  { const d = readU8(), a = readU8(), b = readU8(), c = readU8(); setReg(d, inoise8_3(u16(getReg(a)), u16(getReg(b)), u16(getReg(c)))); } break;
        case OP.SQRT: {
          const d = readU8(), a = readU8();
          const v = getReg(a);
          setReg(d, v > 0 ? sqrt16(u16(v)) : 0);
        } break;
        case OP.ABS: {
          const d = readU8(), a = readU8();
          const v = getReg(a);
          setReg(d, (v === INT32_MIN) ? INT32_MAX : (v < 0 ? -v : v));
        } break;
        case OP.MIN: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, Math.min(getReg(a), getReg(b))); } break;
        case OP.MAX: { const d = readU8(), a = readU8(), b = readU8(); setReg(d, Math.max(getReg(a), getReg(b))); } break;

        // ---- Control Flow ----
        case OP.JMP: {
          const off = readI16();
          const t = pc + off;
          if (t < 0 || t > len) return finish(FRAMETIME);
          pc = t;
        } break;
        case OP.JZ: {
          const a = readU8(), off = readI16();
          if (getReg(a) === 0) { const t = pc + off; if (t < 0 || t > len) return finish(FRAMETIME); pc = t; }
        } break;
        case OP.JNZ: {
          const a = readU8(), off = readI16();
          if (getReg(a) !== 0) { const t = pc + off; if (t < 0 || t > len) return finish(FRAMETIME); pc = t; }
        } break;
        case OP.JLT: {
          const a = readU8(), b = readU8(), off = readI16();
          if (getReg(a) < getReg(b)) { const t = pc + off; if (t < 0 || t > len) return finish(FRAMETIME); pc = t; }
        } break;
        case OP.JGT: {
          const a = readU8(), b = readU8(), off = readI16();
          if (getReg(a) > getReg(b)) { const t = pc + off; if (t < 0 || t > len) return finish(FRAMETIME); pc = t; }
        } break;
        case OP.JEQ: {
          const a = readU8(), b = readU8(), off = readI16();
          if (getReg(a) === getReg(b)) { const t = pc + off; if (t < 0 || t > len) return finish(FRAMETIME); pc = t; }
        } break;
        case OP.JLE: {
          const a = readU8(), b = readU8(), off = readI16();
          if (getReg(a) <= getReg(b)) { const t = pc + off; if (t < 0 || t > len) return finish(FRAMETIME); pc = t; }
        } break;
        case OP.JGE: {
          const a = readU8(), b = readU8(), off = readI16();
          if (getReg(a) >= getReg(b)) { const t = pc + off; if (t < 0 || t > len) return finish(FRAMETIME); pc = t; }
        } break;
        case OP.CALL: {
          const off = readI16();
          if (callDepth >= CALL_STACK_DEPTH) return finish(FRAMETIME);
          callStack[callDepth++] = pc;
          const target = pc + off;
          if (target < 0 || target > len) return finish(FRAMETIME);
          pc = target;
        } break;
        case OP.RET: {
          if (callDepth > 0) pc = callStack[--callDepth];
          else return finish(FRAMETIME);
        } break;
        case OP.HALT: {
          const a = readU8();
          const delay = u16(getReg(a));
          return finish(delay > 0 ? delay : FRAMETIME);
        } break;
        case OP.HALTS: {
          // frame() with no args: compute delay from speed using SPEED_FORMULA_L
          // Higher speed = shorter delay = faster animation
          const spd = regs[REG.P0] & 0xFF;
          return finish(5 + Math.floor((50 * (255 - spd)) / 255));
        } break;

        // ---- Data Buffer ----
        case OP.ALLOC: {
          const a = readU8();
          const raw = getReg(a);
          const size = u16(raw > 0 ? Math.min(raw, 4096) : 0);
          if (size > 0 && !dataBuf) {
            dataBuf = new Uint8Array(size);
            dataLen = size;
            state.dataBuf = dataBuf;
            state.dataLen = dataLen;
            setReg(0, 1);
          } else if (dataBuf) {
            setReg(0, 1); // already allocated
          } else {
            setReg(0, 0);
          }
        } break;

        // ---- 2D Geometry ----
        case OP.DLINE: {
          const x0r = readU8(), y0r = readU8(), x1r = readU8(), y1r = readU8(), cr = readU8();
          drawLine(pixels2d, w, h, getReg(x0r), getReg(y0r), getReg(x1r), getReg(y1r), getColor(cr));
        } break;
        case OP.DCIRC: {
          const cxr = readU8(), cyr = readU8(), rr = readU8(), cr = readU8();
          drawCircle(pixels2d, w, h, getReg(cxr), getReg(cyr), getReg(rr), getColor(cr));
        } break;
        case OP.FCIRC: {
          const cxr = readU8(), cyr = readU8(), rr = readU8(), cr = readU8();
          fillCircle(pixels2d, w, h, getReg(cxr), getReg(cyr), getReg(rr), getColor(cr));
        } break;
        case OP.MOVEP: {
          const dr = readU8(), delta = readU8(), wrap = readU8();
          movePixels(pixels2d, w, h, u8(getReg(dr)), u8(getReg(delta)), !!getReg(wrap));
        } break;

        // ---- Text Operations ----
        case OP.DCHR: {
          const chr_r = readU8(), x_r = readU8(), y_r = readU8();
          const font_r = readU8(), col_r = readU8();
          const fi = Math.max(0, Math.min(4, getReg(font_r)));
          drawCharacter(pixels2d, w, h, getReg(chr_r), getReg(x_r), getReg(y_r), fi, getColor(col_r));
        } break;
        case OP.GCHR: {
          const d = readU8(), a = readU8();
          const idx = getReg(a);
          const name = seg.name || '';
          setReg(d, (idx >= 0 && idx < name.length) ? name.charCodeAt(idx) : 0);
        } break;
        case OP.GNLN: {
          const d = readU8();
          setReg(d, (seg.name || '').length);
        } break;
        case OP.GFNW: {
          const d = readU8(), a = readU8();
          const fw = [4, 5, 6, 7, 5];
          setReg(d, fw[Math.max(0, Math.min(4, getReg(a)))]);
        } break;
        case OP.GFNH: {
          const d = readU8(), a = readU8();
          const fh = [6, 8, 8, 9, 12];
          setReg(d, fh[Math.max(0, Math.min(4, getReg(a)))]);
        } break;

        // ---- Float Operations ----
        case OP.FADD: { const d = readU8(), a = readU8(), b = readU8(); setFloat(d, getFloat(a) + getFloat(b)); } break;
        case OP.FSUB: { const d = readU8(), a = readU8(), b = readU8(); setFloat(d, getFloat(a) - getFloat(b)); } break;
        case OP.FMUL: { const d = readU8(), a = readU8(), b = readU8(); setFloat(d, getFloat(a) * getFloat(b)); } break;
        case OP.FDIV: {
          const d = readU8(), a = readU8(), b = readU8();
          const bv = getFloat(b);
          setFloat(d, bv !== 0 ? getFloat(a) / bv : 0);
        } break;
        case OP.ITOF: { const d = readU8(), a = readU8(); setFloat(d, getReg(a)); } break;
        case OP.FTOI: {
          const d = readU8(), a = readU8();
          const fv = getFloat(a);
          if (isNaN(fv) || !isFinite(fv) || fv > INT32_MAX || fv < INT32_MIN) setReg(d, 0);
          else setReg(d, i32(Math.trunc(fv)));
        } break;
        case OP.FSIN: { const d = readU8(), a = readU8(); setFloat(d, Math.sin(getFloat(a))); } break;
        case OP.FCOS: { const d = readU8(), a = readU8(); setFloat(d, Math.cos(getFloat(a))); } break;

        // ---- Audio ----
        case OP.GVOL:  { setReg(readU8(), 0); } break;
        case OP.GPEAK: { setReg(readU8(), 0); } break;
        case OP.GFFT:  { const d = readU8(); readU8(); setReg(d, 0); } break;
        case OP.ABASS: { setReg(readU8(), 0); } break;
        case OP.AMID:  { setReg(readU8(), 0); } break;
        case OP.ATREB: { setReg(readU8(), 0); } break;

        case OP.NOP: break;

        default:
          return finish(FRAMETIME);
      }
    }

    return finish(FRAMETIME);

    function finish(delay) {
      state.call++;
      return { delay };
    }
  }
}


// ==================== Renderer ====================
// Canvas LED visualization — renders 1D strips or 2D grids

class LEDRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.pixelSize = 12;
    this.gap = 2;
  }

  configure(opts = {}) {
    if (opts.pixelSize != null) this.pixelSize = opts.pixelSize;
    if (opts.gap != null) this.gap = opts.gap;
  }

  // Convert RGBW32 to CSS color string
  _toCSS(c) {
    const w = (c >>> 24) & 0xFF;
    let r = (c >> 16) & 0xFF;
    let g = (c >> 8) & 0xFF;
    let b = c & 0xFF;
    // Mix white channel into RGB
    r = Math.min(255, r + w);
    g = Math.min(255, g + w);
    b = Math.min(255, b + w);
    return `rgb(${r},${g},${b})`;
  }

  // Auto-compute pixel size to fit canvas
  _autoSize(count, canvasLen) {
    if (count <= 0) return this.pixelSize;
    const maxSize = Math.floor((canvasLen - this.gap) / count) - this.gap;
    return Math.max(2, Math.min(this.pixelSize, maxSize));
  }

  render(pixels1d, pixels2d, is2D, width, height) {
    const ctx = this.ctx;
    const cw = this.canvas.width;
    const ch = this.canvas.height;

    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, cw, ch);

    if (is2D && pixels2d && width > 0 && height > 0) {
      this._render2D(pixels2d, width, height, cw, ch);
    } else if (pixels1d && pixels1d.length > 0) {
      this._render1D(pixels1d, cw, ch);
    }
  }

  _render1D(pixels, cw, ch) {
    const ctx = this.ctx;
    const count = pixels.length;
    const ps = this._autoSize(count, cw);
    const gap = this.gap;
    const totalW = count * (ps + gap) - gap;
    const startX = Math.max(0, (cw - totalW) / 2);
    const cy = ch / 2;
    const radius = ps / 2;

    for (let i = 0; i < count; i++) {
      const x = startX + i * (ps + gap) + radius;
      const color = pixels[i];
      if (color === 0) continue;

      const css = this._toCSS(color);

      // Glow effect
      ctx.shadowColor = css;
      ctx.shadowBlur = ps * 0.6;
      ctx.fillStyle = css;
      ctx.beginPath();
      ctx.arc(x, cy, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  _render2D(pixels2d, width, height, cw, ch) {
    const ctx = this.ctx;

    // For large grids, use imageData for performance
    if (width > 32 || height > 32) {
      this._render2DImage(pixels2d, width, height, cw, ch);
      return;
    }

    const psX = this._autoSize(width, cw);
    const psY = this._autoSize(height, ch);
    const ps = Math.min(psX, psY);
    const gap = this.gap;
    const totalW = width * (ps + gap) - gap;
    const totalH = height * (ps + gap) - gap;
    const startX = Math.max(0, (cw - totalW) / 2);
    const startY = Math.max(0, (ch - totalH) / 2);
    const radius = ps / 2;

    for (let y = 0; y < height; y++) {
      const row = pixels2d[y];
      if (!row) continue;
      for (let x = 0; x < width; x++) {
        const color = row[x];
        if (color === 0) continue;

        const css = this._toCSS(color);
        const px = startX + x * (ps + gap) + radius;
        const py = startY + y * (ps + gap) + radius;

        ctx.shadowColor = css;
        ctx.shadowBlur = ps * 0.4;
        ctx.fillStyle = css;
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
  }

  _render2DImage(pixels2d, width, height, cw, ch) {
    const ctx = this.ctx;
    const scaleX = Math.floor(cw / width);
    const scaleY = Math.floor(ch / height);
    const scale = Math.max(1, Math.min(scaleX, scaleY));
    const dw = width * scale;
    const dh = height * scale;
    const ox = Math.floor((cw - dw) / 2);
    const oy = Math.floor((ch - dh) / 2);

    const imgData = ctx.createImageData(dw, dh);
    const data = imgData.data;

    for (let y = 0; y < height; y++) {
      const row = pixels2d[y];
      if (!row) continue;
      for (let x = 0; x < width; x++) {
        const c = row[x];
        const w = (c >>> 24) & 0xFF;
        const r = Math.min(255, ((c >> 16) & 0xFF) + w);
        const g = Math.min(255, ((c >> 8) & 0xFF) + w);
        const b = Math.min(255, (c & 0xFF) + w);

        for (let sy = 0; sy < scale; sy++) {
          for (let sx = 0; sx < scale; sx++) {
            const idx = ((y * scale + sy) * dw + x * scale + sx) * 4;
            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
            data[idx + 3] = 255;
          }
        }
      }
    }

    ctx.putImageData(imgData, ox, oy);
  }
}

// lexer.js
// ============================================================

const T = {
  NUMBER: 'NUMBER', STRING: 'STRING', IDENT: 'IDENT',
  KEYWORD: 'KEYWORD', OP: 'OP', PUNCT: 'PUNCT', EOF: 'EOF',
};

const KEYWORDS = new Set([
  'effect', 'meta', 'render', 'data', 'let',
  'if', 'else', 'for', 'in', 'while', 'step',
  'frame', 'slider', 'type', 'palette',
  'true', 'false', 'and', 'or', 'not',
  'default', 'audio_reactive',
]);

const TWO_CHAR_OPS = new Set(['==', '!=', '<=', '>=', '<<', '>>', '..']);
const ONE_CHAR_OPS = new Set(['+', '-', '*', '/', '%', '&', '|', '^', '~', '<', '>', '=', '!']);
const PUNCTUATION = new Set(['(', ')', '{', '}', '[', ']', ',', ';']);

class Token {
  constructor(type, value, line, col) {
    this.type = type; this.value = value; this.line = line; this.col = col;
  }
}

class LexerError extends Error {
  constructor(msg, line, col) {
    super(`Lexer error at ${line}:${col}: ${msg}`);
    this.line = line; this.col = col;
  }
}

class Lexer {
  constructor(source) {
    this.source = source; this.pos = 0; this.line = 1; this.col = 1;
    this.tokens = []; this._tokenize(); this._index = 0;
  }
  _peek() { return this.pos < this.source.length ? this.source[this.pos] : null; }
  _advance() {
    const ch = this.source[this.pos++];
    if (ch === '\n') { this.line++; this.col = 1; } else { this.col++; }
    return ch;
  }
  _skipWhitespace() {
    while (this.pos < this.source.length) {
      const ch = this.source[this.pos];
      if (ch === ' ' || ch === '\t' || ch === '\r' || ch === '\n') { this._advance(); }
      else if (ch === '/' && this.pos + 1 < this.source.length && this.source[this.pos + 1] === '/') {
        while (this.pos < this.source.length && this.source[this.pos] !== '\n') this._advance();
      } else break;
    }
  }
  _readString() {
    const startLine = this.line, startCol = this.col;
    const quote = this._advance();
    let str = '';
    while (this.pos < this.source.length) {
      const ch = this.source[this.pos];
      if (ch === quote) { this._advance(); return new Token(T.STRING, str, startLine, startCol); }
      if (ch === '\\') {
        this._advance();
        const esc = this._advance();
        switch (esc) {
          case 'n': str += '\n'; break; case 't': str += '\t'; break;
          case '\\': str += '\\'; break; case '"': str += '"'; break;
          case "'": str += "'"; break; default: str += esc;
        }
      } else { str += this._advance(); }
    }
    throw new LexerError('Unterminated string', startLine, startCol);
  }
  _readNumber() {
    const startLine = this.line, startCol = this.col;
    let num = '';
    if (this.source[this.pos] === '0' && this.pos + 1 < this.source.length &&
        (this.source[this.pos + 1] === 'x' || this.source[this.pos + 1] === 'X')) {
      num += this._advance(); num += this._advance();
      while (this.pos < this.source.length && /[0-9a-fA-F]/.test(this.source[this.pos])) num += this._advance();
      if (num.length === 2) throw new LexerError('Invalid hex literal', startLine, startCol);
      return new Token(T.NUMBER, parseInt(num, 16), startLine, startCol);
    }
    while (this.pos < this.source.length && /[0-9]/.test(this.source[this.pos])) num += this._advance();
    if ((num === '1' || num === '2') && this.pos < this.source.length && this.source[this.pos] === 'D') {
      num += this._advance();
      return new Token(T.KEYWORD, num, startLine, startCol);
    }
    return new Token(T.NUMBER, parseInt(num, 10), startLine, startCol);
  }
  _readIdentOrKeyword() {
    const startLine = this.line, startCol = this.col;
    let word = '';
    while (this.pos < this.source.length && /[a-zA-Z0-9_]/.test(this.source[this.pos])) word += this._advance();
    if (word === '1D' || word === '2D') return new Token(T.KEYWORD, word, startLine, startCol);
    if (KEYWORDS.has(word)) return new Token(T.KEYWORD, word, startLine, startCol);
    return new Token(T.IDENT, word, startLine, startCol);
  }
  _tokenize() {
    while (this.pos < this.source.length) {
      this._skipWhitespace();
      if (this.pos >= this.source.length) break;
      const ch = this.source[this.pos];
      const startLine = this.line, startCol = this.col;
      if (ch === '"' || ch === "'") { this.tokens.push(this._readString()); continue; }
      if (/[0-9]/.test(ch)) { this.tokens.push(this._readNumber()); continue; }
      if (/[a-zA-Z_]/.test(ch)) { this.tokens.push(this._readIdentOrKeyword()); continue; }
      if (this.pos + 1 < this.source.length) {
        const two = this.source[this.pos] + this.source[this.pos + 1];
        if (TWO_CHAR_OPS.has(two)) { this._advance(); this._advance(); this.tokens.push(new Token(T.OP, two, startLine, startCol)); continue; }
      }
      if (PUNCTUATION.has(ch)) { this._advance(); this.tokens.push(new Token(T.PUNCT, ch, startLine, startCol)); continue; }
      if (ONE_CHAR_OPS.has(ch)) { this._advance(); this.tokens.push(new Token(T.OP, ch, startLine, startCol)); continue; }
      throw new LexerError(`Unexpected character '${ch}'`, startLine, startCol);
    }
    this.tokens.push(new Token(T.EOF, null, this.line, this.col));
  }
  peek() { return this.tokens[this._index]; }
  next() { return this.tokens[this._index++]; }
  expect(type, value) {
    const tok = this.peek();
    if (tok.type !== type || (value !== undefined && tok.value !== value)) {
      const expected = value !== undefined ? `${type}(${value})` : type;
      throw new LexerError(`Expected ${expected}, got ${tok.type}(${tok.value})`, tok.line, tok.col);
    }
    return this.next();
  }
  check(type, value) {
    const tok = this.peek();
    return tok.type === type && (value === undefined || tok.value === value);
  }
  match(type, value) { if (this.check(type, value)) return this.next(); return null; }
}

// parser.js
// ============================================================

class ParseError extends Error {
  constructor(msg, line, col) {
    super(`Parse error at ${line}:${col}: ${msg}`);
    this.line = line; this.col = col;
  }
}

function parserError(msg, tok) { throw new ParseError(msg, tok.line, tok.col); }

const Node = {
  Effect:   (name, meta, dataDecls, renderBody) => ({ type: 'Effect', name, meta, dataDecls, renderBody }),
  Meta:     (sliders, effectType, palette, audioReactive) => ({ type: 'Meta', sliders, effectType, palette, audioReactive }),
  Slider:   (name, label, defaultVal) => ({ type: 'Slider', name, label, defaultVal }),
  DataDecl: (name, sizeExpr) => ({ type: 'DataDecl', name, sizeExpr }),
  Let:      (name, value) => ({ type: 'Let', name, value }),
  Assign:   (target, value) => ({ type: 'Assign', target, value }),
  If:       (cond, thenBody, elseBody) => ({ type: 'If', cond, thenBody, elseBody }),
  For:      (varName, start, end, step, body) => ({ type: 'For', varName, start, end, step, body }),
  While:    (cond, body) => ({ type: 'While', cond, body }),
  Frame:    (delay) => ({ type: 'Frame', delay }),
  Call:     (name, args) => ({ type: 'Call', name, args }),
  BinOp:    (op, left, right) => ({ type: 'BinOp', op, left, right }),
  Unary:    (op, expr) => ({ type: 'Unary', op, expr }),
  Index:    (array, index) => ({ type: 'Index', array, index }),
  Ident:    (name) => ({ type: 'Ident', name }),
  Number:   (value) => ({ type: 'Number', value }),
  Bool:     (value) => ({ type: 'Bool', value }),
};

class Parser {
  constructor(source) { this.lex = new Lexer(source); }
  parse() { const effect = this._effectDecl(); this.lex.expect(T.EOF); return effect; }

  _effectDecl() {
    this.lex.expect(T.KEYWORD, 'effect');
    const name = this.lex.expect(T.STRING).value;
    this.lex.expect(T.PUNCT, '{');
    let meta = null; const dataDecls = []; let renderBody = null;
    while (!this.lex.check(T.PUNCT, '}')) {
      if (this.lex.check(T.KEYWORD, 'meta')) meta = this._metaBlock();
      else if (this.lex.check(T.KEYWORD, 'data')) dataDecls.push(this._dataDecl());
      else if (this.lex.check(T.KEYWORD, 'render')) renderBody = this._renderBlock();
      else { const tok = this.lex.peek(); parserError(`Unexpected token '${tok.value}' in effect body`, tok); }
    }
    this.lex.expect(T.PUNCT, '}');
    if (!renderBody) parserError('Effect must have a render block', this.lex.peek());
    return Node.Effect(name, meta, dataDecls, renderBody);
  }

  _metaBlock() {
    this.lex.expect(T.KEYWORD, 'meta'); this.lex.expect(T.PUNCT, '{');
    const sliders = []; let effectType = '1D'; let palette = false; let audioReactive = false;
    while (!this.lex.check(T.PUNCT, '}')) {
      if (this.lex.match(T.KEYWORD, 'slider')) {
        const name = this.lex.expect(T.IDENT).value;
        const label = this.lex.expect(T.STRING).value;
        let defaultVal = null;
        if (this.lex.match(T.KEYWORD, 'default')) defaultVal = this._expr();
        sliders.push(Node.Slider(name, label, defaultVal));
      } else if (this.lex.match(T.KEYWORD, 'type')) {
        const tok = this.lex.expect(T.KEYWORD);
        if (tok.value !== '1D' && tok.value !== '2D') parserError(`Expected '1D' or '2D', got '${tok.value}'`, tok);
        effectType = tok.value;
      } else if (this.lex.match(T.KEYWORD, 'palette')) {
        const tok = this.lex.expect(T.KEYWORD);
        palette = tok.value === 'true';
      } else if (this.lex.match(T.KEYWORD, 'audio_reactive')) {
        const tok = this.lex.expect(T.KEYWORD);
        audioReactive = tok.value === 'true';
      } else { const tok = this.lex.peek(); parserError(`Unexpected token '${tok.value}' in meta block`, tok); }
    }
    this.lex.expect(T.PUNCT, '}');
    return Node.Meta(sliders, effectType, palette, audioReactive);
  }

  _dataDecl() {
    this.lex.expect(T.KEYWORD, 'data');
    const name = this.lex.expect(T.IDENT).value;
    this.lex.expect(T.PUNCT, '[');
    const sizeExpr = this._expr();
    this.lex.expect(T.PUNCT, ']');
    return Node.DataDecl(name, sizeExpr);
  }

  _renderBlock() {
    this.lex.expect(T.KEYWORD, 'render'); this.lex.expect(T.PUNCT, '{');
    const stmts = this._stmtList(); this.lex.expect(T.PUNCT, '}');
    return stmts;
  }

  _stmtList() {
    const stmts = [];
    while (!this.lex.check(T.PUNCT, '}') && !this.lex.check(T.EOF)) stmts.push(this._stmt());
    return stmts;
  }

  _stmt() {
    if (this.lex.check(T.KEYWORD, 'let')) return this._letStmt();
    if (this.lex.check(T.KEYWORD, 'if')) return this._ifStmt();
    if (this.lex.check(T.KEYWORD, 'for')) return this._forStmt();
    if (this.lex.check(T.KEYWORD, 'while')) return this._whileStmt();
    if (this.lex.check(T.KEYWORD, 'frame')) return this._frameStmt();
    const expr = this._expr();
    if (this.lex.match(T.OP, '=')) { const value = this._expr(); return Node.Assign(expr, value); }
    return expr;
  }

  _letStmt() {
    this.lex.expect(T.KEYWORD, 'let');
    const name = this.lex.expect(T.IDENT).value;
    this.lex.expect(T.OP, '=');
    return Node.Let(name, this._expr());
  }

  _ifStmt() {
    this.lex.expect(T.KEYWORD, 'if');
    const cond = this._expr();
    this.lex.expect(T.PUNCT, '{');
    const thenBody = this._stmtList();
    this.lex.expect(T.PUNCT, '}');
    let elseBody = null;
    if (this.lex.match(T.KEYWORD, 'else')) {
      if (this.lex.check(T.KEYWORD, 'if')) { elseBody = [this._ifStmt()]; }
      else { this.lex.expect(T.PUNCT, '{'); elseBody = this._stmtList(); this.lex.expect(T.PUNCT, '}'); }
    }
    return Node.If(cond, thenBody, elseBody);
  }

  _forStmt() {
    this.lex.expect(T.KEYWORD, 'for');
    const varName = this.lex.expect(T.IDENT).value;
    this.lex.expect(T.KEYWORD, 'in');
    const start = this._expr();
    this.lex.expect(T.OP, '..');
    const end = this._expr();
    let step = null;
    if (this.lex.match(T.KEYWORD, 'step')) step = this._expr();
    this.lex.expect(T.PUNCT, '{');
    const body = this._stmtList();
    this.lex.expect(T.PUNCT, '}');
    return Node.For(varName, start, end, step, body);
  }

  _whileStmt() {
    this.lex.expect(T.KEYWORD, 'while');
    const cond = this._expr();
    this.lex.expect(T.PUNCT, '{');
    const body = this._stmtList();
    this.lex.expect(T.PUNCT, '}');
    return Node.While(cond, body);
  }

  _frameStmt() {
    this.lex.expect(T.KEYWORD, 'frame');
    this.lex.expect(T.PUNCT, '(');
    let delay = null;
    if (!this.lex.check(T.PUNCT, ')')) delay = this._expr();
    this.lex.expect(T.PUNCT, ')');
    return Node.Frame(delay);
  }

  _expr() { return this._orExpr(); }

  _orExpr() {
    let left = this._andExpr();
    while (this.lex.match(T.KEYWORD, 'or')) left = Node.BinOp('or', left, this._andExpr());
    return left;
  }

  _andExpr() {
    let left = this._cmpExpr();
    while (this.lex.match(T.KEYWORD, 'and')) left = Node.BinOp('and', left, this._cmpExpr());
    return left;
  }

  _cmpExpr() {
    let left = this._addExpr();
    const cmpOps = ['==', '!=', '<', '>', '<=', '>='];
    const tok = this.lex.peek();
    if (tok.type === T.OP && cmpOps.includes(tok.value)) {
      const op = this.lex.next().value;
      left = Node.BinOp(op, left, this._addExpr());
    }
    return left;
  }

  _addExpr() {
    let left = this._mulExpr();
    while (true) {
      const tok = this.lex.peek();
      if (tok.type === T.OP && (tok.value === '+' || tok.value === '-' || tok.value === '|' || tok.value === '^')) {
        left = Node.BinOp(this.lex.next().value, left, this._mulExpr());
      } else break;
    }
    return left;
  }

  _mulExpr() {
    let left = this._unaryExpr();
    while (true) {
      const tok = this.lex.peek();
      if (tok.type === T.OP && (tok.value === '*' || tok.value === '/' || tok.value === '%' ||
          tok.value === '&' || tok.value === '<<' || tok.value === '>>')) {
        left = Node.BinOp(this.lex.next().value, left, this._unaryExpr());
      } else break;
    }
    return left;
  }

  _unaryExpr() {
    if (this.lex.check(T.OP, '-')) { this.lex.next(); return Node.Unary('-', this._unaryExpr()); }
    if (this.lex.check(T.KEYWORD, 'not')) { this.lex.next(); return Node.Unary('not', this._unaryExpr()); }
    if (this.lex.check(T.OP, '~')) { this.lex.next(); return Node.Unary('~', this._unaryExpr()); }
    return this._postfixExpr();
  }

  _postfixExpr() {
    let expr = this._primary();
    while (true) {
      if (this.lex.check(T.PUNCT, '(')) {
        this.lex.next();
        const args = [];
        if (!this.lex.check(T.PUNCT, ')')) {
          args.push(this._expr());
          while (this.lex.match(T.PUNCT, ',')) args.push(this._expr());
        }
        this.lex.expect(T.PUNCT, ')');
        if (expr.type === 'Ident') expr = Node.Call(expr.name, args);
        else parserError('Expected function name before ()', this.lex.peek());
      } else if (this.lex.check(T.PUNCT, '[')) {
        this.lex.next();
        const index = this._expr();
        this.lex.expect(T.PUNCT, ']');
        expr = Node.Index(expr, index);
      } else break;
    }
    return expr;
  }

  _primary() {
    if (this.lex.check(T.NUMBER)) return Node.Number(this.lex.next().value);
    if (this.lex.check(T.KEYWORD, 'true')) { this.lex.next(); return Node.Bool(true); }
    if (this.lex.check(T.KEYWORD, 'false')) { this.lex.next(); return Node.Bool(false); }
    if (this.lex.check(T.IDENT)) return Node.Ident(this.lex.next().value);
    if (this.lex.check(T.KEYWORD, 'palette')) return Node.Ident(this.lex.next().value);
    if (this.lex.match(T.PUNCT, '(')) { const expr = this._expr(); this.lex.expect(T.PUNCT, ')'); return expr; }
    const tok = this.lex.peek();
    parserError(`Unexpected token '${tok.value}'`, tok);
  }
}

  abs:         { op: OP.ABS,   args: 1, hasDestReg: true, vmOperands: 2 },
